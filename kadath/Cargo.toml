[package]
name = "kadath"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kadath"
path = "src/kadath.rs"

[dependencies]
model = { path = "../model" }
db = { path = "../db" }
alor = { path = "../alor" }
signal = { path = "../signal" }
tokio = { version = "1.53", features = ["full"] }
tokio_schedule = "0.3"
dotenv = "0.15.0"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"