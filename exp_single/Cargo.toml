[package]
name = "exp_single"
version = "0.1.0"
edition = "2024"

[dependencies]
model = { path = "../model" }
db = { path = "../db" }
dotenv = "0.15"
tokio = { version = "1.53", features = ["full"] }
simplelog = "0.12"
log = "0.4"
chrono = "0.4"
argmin = { version = "0.11.0", features = ["_ndarrayl"] }
ndarray = "0.16"
plotters = "0.3"
gbdt = "0.1.3"
correlation = "0.1"
#lightgbm3 = "1.0"
lightgbm3 = { git = "https://github.com/shutkin/lightgbm3-rs", branch = "fix-nanoarrow-link" }
serde_json = "1.0"
optimizer = "1.0"
#rustuna = { git = "https://github.com/optuna/rustuna", branch = "main" }