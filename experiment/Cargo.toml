[package]
name = "experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
model = { path = "../model" }
db = { path = "../db" }
dotenv = "0.15"
simplelog = "0.12"
tokio = { version = "1.48", features = ["full"] }
chrono = "0.4"
log = "0.4"
argmin = { version = "0.11.0", features = ["_ndarrayl"] }
ndarray = "0.16"
correlation = "0.1"
gbdt = "0.1.3"
lightgbm3 = { git = "https://github.com/shutkin/lightgbm3-rs", branch = "fix-nanoarrow-link" }
serde_json = "1.0"
optimizer = "1.0"
